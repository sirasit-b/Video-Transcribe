[package]
name = "auto-trim-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-correlating two hour-long loudness envelopes at every lag is only
# practical through the frequency domain.
rustfft = "6"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
