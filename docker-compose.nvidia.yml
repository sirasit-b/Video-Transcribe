# GPU rendering on NVIDIA (NVENC + NVDEC).
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# Needs the NVIDIA Container Toolkit on the host. After starting, check what was
# actually picked up:  curl http://localhost:8734/api/auto-trim/capabilities
services:
  auto-trim:
    environment:
      # NVENC and NVDEC live behind the `video` capability; without it the device
      # is visible but the encoder cannot open.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
