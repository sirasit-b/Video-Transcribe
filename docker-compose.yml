services:
  db:
    image: postgres:15-alpine
    container_name: borntodev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-borntodev_db}
    ports:
      - "6879:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frame-extractor:
    build:
      context: ./frame-extractor-rs
      dockerfile: Dockerfile
    container_name: borntodev-frame-extractor
    environment:
      - VIDEO_ROOT=/app/videos
      - OUTPUT_ROOT=/app/frames
    volumes:
      - videos_data:/app/videos
      - frames_data:/app/frames
    restart: unless-stopped

  auto-trim:
    build:
      context: ./auto-trim-rs
      dockerfile: Dockerfile
    container_name: borntodev-auto-trim
    environment:
      - VIDEO_ROOT=/app/videos
      - WORK_DIR=/tmp/auto-trim
      # Trims run as jobs and share these encode slots, so several videos can be in
      # flight without oversubscribing the machine. Left unset, ENCODE_WORKERS is
      # the core count divided by THREADS_PER_CHUNK.
      - MAX_ACTIVE_JOBS=4
      # - ENCODE_WORKERS=4
      # - THREADS_PER_CHUNK=2
      # Longest video a trim will accept, in seconds (3 hours).
      - MAX_DURATION_SECONDS=10800
    volumes:
      - videos_data:/app/videos
    # Only matters when the machine is busy: at rest a trim still uses everything
    # it can, but under contention the database and the API get served first. A
    # render that saturates every core for ten minutes otherwise takes the site
    # down with it, which is how this was found.
    cpu_shares: 512
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: borntodev-backend
    ports:
      - "8734:8000"
    environment:
      # Everything else (JWT_SECRET_KEY, APP_ENV, FRONTEND_ORIGINS, OPENAI_API_KEY,
      # WEB_CONCURRENCY, ...) comes from env_file below.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-borntodev_db}
      - FRAME_EXTRACTOR_URL=http://frame-extractor:8081
      - AUTO_TRIM_URL=http://auto-trim:8082
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      frame-extractor:
        condition: service_started
      auto-trim:
        condition: service_started
    volumes:
      - videos_data:/app/videos
      - texts_data:/app/texts
      - frames_data:/app/frames
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — rebuild the image to change it.
        NEXT_PUBLIC_API_URL: http://localhost:8734
    container_name: borntodev-frontend
    ports:
      - "4287:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  videos_data:
  texts_data:
  frames_data:
